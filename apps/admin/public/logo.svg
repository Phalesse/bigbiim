<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="BIGBIIM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="240" fill="#ffffff"/>
  <!-- Icône -->
  <g transform="translate(30,30)">
    <rect width="180" height="180" rx="40" fill="#0B3C7A"/>
    <!-- fils tissés entre les acteurs -->
    <path d="M45 120 Q90 40 135 120" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M45 120 Q90 160 135 120" fill="none" stroke="#F28C28" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 120 L90 60 L135 120" fill="none" stroke="#2FA66A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- trois acteurs -->
    <circle cx="90" cy="58" r="17" fill="#ffffff"/>
    <circle cx="45" cy="120" r="17" fill="#F28C28"/>
    <circle cx="135" cy="120" r="17" fill="#2FA66A"/>
    <circle cx="90" cy="58" r="7" fill="#0B3C7A"/>
  </g>
  <!-- Nom -->
  <text x="245" y="138" font-family="Poppins, Nunito, Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="#0B3C7A">BIG<tspan fill="#F28C28">B</tspan>II<tspan fill="#2FA66A">M</tspan></text>
  <!-- Slogan -->
  <text x="248" y="182" font-family="Poppins, Nunito, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#4A5568">Une activité. Toute l’équipe.</text>
</svg>
