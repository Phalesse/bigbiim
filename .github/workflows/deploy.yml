name: Deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bigbiim-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/bigbiim-${{ matrix.app }}:${{ github.sha }}

  deploy-vps:
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/bigbiim || git clone https://github.com/${{ github.repository }} /opt/bigbiim
            cd /opt/bigbiim
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
