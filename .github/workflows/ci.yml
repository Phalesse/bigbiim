name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: "postgresql://bigbiim:bigbiim@postgres:5432/bigbiim?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Valider la configuration Docker Compose
        run: docker compose config --quiet

      - name: Démarrer la pile Docker de test
        run: |
          docker compose up --build -d postgres redis nats minio gotenberg traefik

      - name: Lancer les vérifications dans le conteneur Docker
        run: |
          docker compose run --rm --no-deps -T deps sh -lc "
            npm install --no-audit --no-fund && \
            npm run build -w @bigbiim/rules && \
            npx prisma generate --schema apps/api/prisma/schema.prisma && \
            npx prisma db push --accept-data-loss --skip-generate --schema apps/api/prisma/schema.prisma && \
            npx prisma db execute --file apps/api/prisma/sql/constraints.sql --schema apps/api/prisma/schema.prisma && \
            npm run typecheck && \
            npm test
          "

      - name: Afficher les logs si la validation Docker échoue
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Nettoyer la pile Docker
        if: always()
        run: docker compose down -v --remove-orphans

  docker-images:
    runs-on: ubuntu-latest
    needs: docker-verify
    strategy:
      matrix:
        app: [api, worker, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.app }}
          push: false
          load: true
          tags: bigbiim-${{ matrix.app }}:ci
      - name: Analyse de sécurité (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bigbiim-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/bigbiim
