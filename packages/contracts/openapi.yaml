openapi: 3.0.3
info:
  title: BIGBIIM API
  version: 1.0.0
  description: Source de vérité des API (section 2). Erreurs au format RFC 7807, Idempotency-Key obligatoire sur les POST qui touchent l’argent.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/auth/otp/request":
    post:
      tags: [identity]
      summary: "Envoie un code par SMS/WhatsApp"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/auth/otp/verify":
    post:
      tags: [identity]
      summary: "Vérifie le code, renvoie les jetons"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/auth/register":
    post:
      tags: [identity]
      summary: "Crée un compte (client ou prestataire)"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/auth/login":
    post:
      tags: [identity]
      summary: "Connexion par e-mail et mot de passe"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/auth/refresh":
    post:
      tags: [identity]
      summary: "Renouvelle le jeton"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/auth/logout":
    post:
      tags: [identity]
      summary: "Révoque la session"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/me":
    get:
      tags: [identity]
      summary: "Profil courant"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
    patch:
      tags: [identity]
      summary: "Modifie le profil"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
    delete:
      tags: [identity]
      summary: "Demande de suppression (droit à l’effacement)"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/me/notification-preferences":
    put:
      tags: [identity]
      summary: "Canaux et langues"
      x-roles: "any"
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/sectors":
    get:
      tags: [catalog]
      summary: "Arborescence des secteurs"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/activities":
    get:
      tags: [catalog]
      summary: "Recherche (q, sector, city, page)"
      x-roles: "public"
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/activities/{id}":
    get:
      tags: [catalog]
      summary: "Fiche activité publiée"
      x-roles: "public"
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: OK}
        default: {description: "Erreur (RFC 7807)"}
  "/activities/{id}/questionnaire":
    get:
      tags: [catalog]
