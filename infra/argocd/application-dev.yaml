# Argo CD (GitOps) : l'état du cluster est décrit dans Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bigbiim-dev
  namespace: platform
spec:
  project: default
  source:
    repoURL: https://github.com/VOTRE-COMPTE/VOTRE-DEPOT.git   # à remplacer
    targetRevision: main
    path: infra/helm/bigbiim
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
