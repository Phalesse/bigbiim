global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    metrics_path: /metrics   # à exposer dans l'API (OpenTelemetry / prom-client)
    static_configs:
      - targets: ['api:4000']
