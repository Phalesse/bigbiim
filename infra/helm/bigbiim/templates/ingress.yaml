{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bigbiim.fullname" . }}
  labels:
    {{- include "bigbiim.labels" . | nindent 4 }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range $name, $app := .Values.apps }}
          {{- if and $app.enabled $app.port $app.path }}
          - path: {{ $app.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bigbiim.fullname" $ }}-{{ $name }}
                port:
                  number: {{ $app.port }}
          {{- end }}
          {{- end }}
{{- end }}
