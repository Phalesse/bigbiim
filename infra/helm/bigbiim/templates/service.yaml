{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled $app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bigbiim.fullname" $ }}-{{ $name }}
  labels:
    {{- include "bigbiim.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    {{- include "bigbiim.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- end }}
{{- end }}
